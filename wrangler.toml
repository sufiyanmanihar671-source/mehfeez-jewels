# Cloudflare Pages configuration for Mehfeez Jewels.
# Because this file exists, Cloudflare Pages uses it as the source of truth:
# variables entered in the dashboard are ignored, so public vars live here.
# Build command: npm run build   |   Output directory: .svelte-kit/cloudflare
name = "mehfeez-jewels"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# PUBLIC values only. The publishable/anon key is designed to be public;
# every table is protected by Row Level Security.
# NEVER put the Supabase service_role / secret key anywhere in this project.
# Local `wrangler pages dev` uses .dev.vars instead (it overrides these).
[vars]
PUBLIC_SUPABASE_URL = "https://oowhlrwxftiqyomhedod.supabase.co"
PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_jllNaVDQ5Vt4PsxszI2o-g_UyYJ5h5V"
PUBLIC_SITE_URL = "https://mehfeezjewels.com"
PUBLIC_SUPABASE_IMAGE_TRANSFORM = "false"
# Set to "true" after enabling the Google provider in Supabase (Auth > Sign In / Providers).
PUBLIC_GOOGLE_LOGIN = "false"
